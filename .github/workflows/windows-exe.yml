name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Start-VIctory.bat"
      - "README.md"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build VIctory for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm Rust installation
        run: rustc --version && cargo --version

      - name: Build release executable
        run: cargo build --release --locked -p victory

      - name: Confirm executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/victory.exe")) {
            throw "Build did not produce target/release/victory.exe"
          }
          Get-Item "target/release/victory.exe" | Format-List Name,Length,FullName

      - name: Package launcher and documentation
        shell: pwsh
        run: |
          $package = Join-Path $PWD "VIctory-Windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target/release/victory.exe" $package
          Copy-Item "Start-VIctory.bat" $package
          Copy-Item "README.md" $package
          Compress-Archive -Path "$package/*" -DestinationPath "VIctory-Windows-x64.zip" -Force

      - name: Upload packaged launcher
        uses: actions/upload-artifact@v4
        with:
          name: VIctory-Windows-x64-Launcher
          path: VIctory-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
