name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build VIctory for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm Rust installation
        run: rustc --version && cargo --version

      - name: Build release executable
        run: cargo build --release --locked -p victory

      - name: Confirm executable exists
        run: |
          if (!(Test-Path "target/release/victory.exe")) {
            throw "Build did not produce target/release/victory.exe"
          }
          Get-Item "target/release/victory.exe" | Format-List Name,Length,FullName
        shell: pwsh

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIctory-Windows-x64
          path: target/release/victory.exe
          if-no-files-found: error
          retention-days: 14
